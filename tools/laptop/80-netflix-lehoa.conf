# Bat may la tu vao phien Netflix cua lehoa, khong dung o man dang nhap (anh Huy chon 8/10/2026).
# lehoa khong co mat khau (nhom nopasswdlogin) nen tu vao khong mo them cua nao. Het phut thi
# netflix-phien hien hop "Het phut" roi dang xuat ve man dang nhap; LightDM chi tu vao mot lan
# moi lan bat may, khong tu vao lai sau khi dang xuat (thu 8/10/2026), nen khong thanh vong lap.
# Muon dung tai khoan Admin (huy) thi bam nut thoat cua phien Netflix roi chon Admin.
#
# Nam o lightdm.conf.d chu khong sua /etc/lightdm/lightdm.conf: file do la cua cong cu "Cửa sổ
# đăng nhập" cua Mint. LightDM doc lightdm.conf sau cung, nen dat autologin-user o cong cu do se
# de len file nay.
[Seat:*]
autologin-user=lehoa
autologin-user-timeout=0
